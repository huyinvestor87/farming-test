<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#78c96b"><title>Willowbrook Farm</title>
  <link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles/main.css?v=20260820">
</head>
<body>
  <div id="loading"><div class="logo"><span>W</span><h1>Willowbrook Farm</h1><p data-i18n="tagline">Gieo trồng chút hạnh phúc</p></div><div class="loadbar"><i></i></div><small id="loadTip" data-i18n="loadTip">Đang gieo hoa dại…</small><div id="menuActions" class="hidden"><button data-menu="continue" data-i18n="menuContinue">Tiếp tục</button><button data-menu="new" data-i18n="menuNew">Nông trại mới</button><button data-menu="settings" data-i18n="menuSettings">Cài đặt</button><button data-menu="import" data-i18n="menuImport">Nhập file lưu</button><button data-menu="credits" data-i18n="menuCredits">Giới thiệu</button></div></div>
  <main id="game" class="hidden">
    <canvas id="world" aria-label="Interactive isometric farm"></canvas>
    <header id="hud"><button class="profile" data-action="character"><b id="level">1</b><span data-i18n="labelLevel">CẤP</span></button><div class="meter xp"><i id="xpbar"></i></div><button class="pill"><i class="energy"></i><b id="energy">30</b></button><button class="pill"><i class="coin"></i><b id="coins">0</b></button><button class="pill"><i class="gem"></i><b id="gems">0</b></button></header>
    <aside class="right-tools"><button data-action="howto" data-i18n-title="toolHowto" title="Cách chơi">?</button><button data-action="quests" data-i18n-title="toolQuests" title="Nhiệm vụ">✓</button><button data-action="orders" data-i18n-title="toolOrders" title="Đơn hàng">▤</button><button data-action="settings" data-i18n-title="toolSettings" title="Cài đặt">⚙</button><button data-action="zoomIn">＋</button><button data-action="zoomOut">−</button></aside>
    <div id="weather"><b>Willowbrook</b><span id="daypart">Trời nắng</span><em id="buffLabel">Chưa có vòi phun · Chưa có thú cưng</em></div>
    <div id="tutorial"><b id="tutTitle">Chào mừng, nông dân!</b><span id="tutText">Kéo để khám phá nông trại mới của bạn.</span><button id="tutNext" data-i18n="tutGot">Đã hiểu</button><button id="tutSkip" data-i18n="tutSkip">Bỏ qua</button></div>
    <nav id="dock"><button data-action="farm" class="active"><i>⌂</i><span data-i18n="dockFarm">Nông trại</span></button><button data-action="seeds"><i>♧</i><span data-i18n="dockPlant">Trồng</span></button><button data-action="animals"><i>♘</i><span data-i18n="dockAnimals">Vật nuôi</span></button><button data-action="craft"><i>♨</i><span data-i18n="dockCraft">Chế biến</span></button><button data-action="fish"><i>◜</i><span data-i18n="dockFish">Câu cá</span></button><button data-action="market"><i>▱</i><span data-i18n="dockMarket">Chợ</span></button><button data-action="inventory"><i>▣</i><span data-i18n="dockInventory">Kho</span></button><button data-action="build"><i>⚒</i><span data-i18n="dockBuild">Xây dựng</span></button></nav>
    <section id="panel" class="panel hidden"><header><div><small id="panelKicker">WILLOWBROOK</small><h2 id="panelTitle">Kho</h2></div><button id="panelClose">×</button></header><div id="panelTabs"></div><div id="panelBody"></div></section>
    <div id="toast"></div><div id="placement" class="hidden"><span data-i18n="placementHint">Chạm vào ô trống để đặt</span><button data-place="rotate" data-i18n="placementRotate">Xoay</button><button data-place="cancel" data-i18n="placementCancel">Hủy</button></div>
    <input id="importFile" type="file" accept="application/json" hidden>
  </main>
  <script type="module" src="src/main.js?v=20260820"></script>
</body></html>
